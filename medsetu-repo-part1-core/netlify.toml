# MedSetu — Netlify build configuration
# The site is a fully static Next.js export. Netlify installs dependencies,
# runs the build (the npm "prebuild" hook first stages the data and image
# libraries into public/ via scripts/prepare-data.mjs, then `next build`
# produces the static site), and publishes the out/ folder.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
